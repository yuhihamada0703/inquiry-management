name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}/backend
  FRONTEND_IMAGE: ${{ github.repository }}/frontend

jobs:
  # ──────────────────────────────────────────────
  # 1. Backend テスト（H2 インメモリ DB で実行）
  # ──────────────────────────────────────────────
  test-backend:
    name: Backend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/

  # ──────────────────────────────────────────────
  # 2. Frontend lint / テスト / ビルド確認
  # ──────────────────────────────────────────────
  test-frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --passWithNoTests --watchAll=false

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # ──────────────────────────────────────────────
  # 3. Backend Docker イメージをビルドして ghcr.io へ push
  #    (main push 時のみ)
  # ──────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ──────────────────────────────────────────────
  # 4. Frontend Docker イメージをビルドして ghcr.io へ push
  #    NEXT_PUBLIC_API_URL は GitHub Secret から取得
  #    (main push 時のみ)
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build & Push Frontend Image
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ──────────────────────────────────────────────
  # 5. サーバーへデプロイ（AWS SSM Run Command 経由。SSH 不要）
  #    (main push 時のみ)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [build-backend, build-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy via SSM Run Command
        env:
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # jq で JSON を安全に組み立て（トークン内の特殊文字をエスケープ）
          # sudo -H -u ec2-user で実行: HOME が設定されるため git/docker が正常動作
          COMMANDS=$(jq -cn \
            --arg token "$GHCR_TOKEN" \
            --arg actor "$GHCR_ACTOR" \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            '[
              ("echo " + $token + " | sudo -H -u ec2-user docker login ghcr.io -u " + $actor + " --password-stdin"),
              ("sudo -H -u ec2-user docker pull " + $backend + ":latest"),
              ("sudo -H -u ec2-user docker pull " + $frontend + ":latest"),
              "sudo -H -u ec2-user bash -c \"cd ~/inquiry-management && git fetch origin && git checkout main && git pull origin main\"",
              ("sudo -H -u ec2-user bash -c \"cd ~/inquiry-management && BACKEND_IMAGE=" + $backend + " FRONTEND_IMAGE=" + $frontend + " docker compose up -d --no-deps --pull always backend frontend\""),
              "docker image prune -f"
            ]')

          COMMAND_ID=$(aws ssm send-command \
            --region ap-northeast-1 \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=$COMMANDS" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"

          # aws ssm wait は使わず手動ポーリング（最大10分）
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --region ap-northeast-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query "StatusDetails" --output text 2>/dev/null || echo "Pending")
            echo "[$i/60] Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy succeeded!"
              aws ssm get-command-invocation \
                --region ap-northeast-1 \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed: $STATUS"
              aws ssm get-command-invocation \
                --region ap-northeast-1 \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                --query "[StandardOutputContent, StandardErrorContent]" --output json
              exit 1
            fi
          done
          echo "Timeout waiting for deploy"
          exit 1
